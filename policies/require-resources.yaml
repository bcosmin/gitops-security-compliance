---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-cpu-memory-limits
  annotations:
    policies.kyverno.io/title: Require CPU and Memory Requests/Limits
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must have resource requests and limits defined to ensure cluster stability and fair-share scheduling.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Governance violation: All containers must declare both requests and limits for CPU and Memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "*"
                    memory: "*"
                  limits:
                    cpu: "*"
                    memory: "*"