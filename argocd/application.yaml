---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-deployment
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_GITHUB_USERNAME/gitops-security-compliance.git' # Update with your repository URL
    targetRevision: HEAD
    path: applications/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true